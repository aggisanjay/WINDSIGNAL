<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="sunburstGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D97706" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Circular Outer Badge -->
  <circle cx="32" cy="32" r="29" fill="url(#sunburstGrad)" filter="url(#glow)" />

  <!-- Center Hub -->
  <circle cx="32" cy="32" r="7.5" fill="#07172B" />

  <!-- 8 Sunburst Energy Rays -->
  <!-- Vertical -->
  <line x1="32" y1="8" x2="32" y2="17" stroke="#07172B" stroke-width="4" stroke-linecap="round" />
  <line x1="32" y1="47" x2="32" y2="56" stroke="#07172B" stroke-width="4" stroke-linecap="round" />
  <!-- Horizontal -->
  <line x1="8" y1="32" x2="17" y2="32" stroke="#07172B" stroke-width="4" stroke-linecap="round" />
  <line x1="47" y1="32" x2="56" y2="32" stroke="#07172B" stroke-width="4" stroke-linecap="round" />
  <!-- Diagonals -->
  <line x1="15" y1="15" x2="21.5" y2="21.5" stroke="#07172B" stroke-width="4" stroke-linecap="round" />
  <line x1="42.5" y1="42.5" x2="49" y2="49" stroke="#07172B" stroke-width="4" stroke-linecap="round" />
  <line x1="15" y1="49" x2="21.5" y2="42.5" stroke="#07172B" stroke-width="4" stroke-linecap="round" />
  <line x1="42.5" y1="21.5" x2="49" y2="15" stroke="#07172B" stroke-width="4" stroke-linecap="round" />
</svg>